
services:
  postgres:
    image: postgres:14
    container_name: postgres_db
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: file_management_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
