services:
  filenest-backend:
    container_name: filenest-backend
    restart: unless-stopped
    build:
      context: .
      target: production
      args:
        - PORT=${PORT}
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env
    networks:
      - app-network

  filenest-backend-dev:
    container_name: filenest-backend-dev
    build:
      context: .
      target: dev
      args:
        - PORT=${PORT}
    ports:
      - '${PORT}:${PORT}'
    env_file:
      - .env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - app-network
      
  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - certs:/etc/letsencrypt
      - webroot:/var/www/certbot
    environment:
      - INSTANCE_DOMAIN=${INSTANCE_DOMAIN}
    command: /bin/sh -c "envsubst '$$INSTANCE_DOMAIN' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"
    depends_on:
      - filenest-backend
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certs:/etc/letsencrypt
      - webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network
  postgres:
    image: postgres:14
    container_name: postgres_db
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:
  node_modules:

networks:
  app-network:
