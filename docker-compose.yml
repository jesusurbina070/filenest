  services:
  backend:
    image: node:22
    container_name: postgres_db_rds
    restart: always
    ports:
      - '5432:5432'
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      NODE_ENV: production
    env_file:
      - .env
